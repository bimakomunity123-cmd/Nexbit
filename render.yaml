# Render Blueprint — creates the API web service and its Postgres
# database together. In the Render dashboard: New → Blueprint → pick
# this repo (and the `backend-deploy` branch, until it's merged to
# main) → Render reads this file and provisions everything below.
#
# JWT_SECRET is auto-generated by Render (generateValue: true) — nobody
# needs to pick or store it manually. CORS_ORIGINS is pre-set to the
# live GitHub Pages demo's origin; add more (comma-separated) if the
# frontend ever moves or gets a custom domain.
databases:
  - name: nexbit-db
    plan: free
    databaseName: nexbit
    user: nexbit

services:
  - type: web
    name: nexbit-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: nexbit-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://bimakomunity123-cmd.github.io
      - key: CORS_ORIGIN_REGEX
        value: "http://(localhost|127\\.0\\.0\\.1)(:\\d+)?"
